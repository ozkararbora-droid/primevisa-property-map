<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PrimeVisa Yunanistan Emlak Haritası</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
:root{--navy:#071d3a;--navy2:#0c2d57;--gold:#f2c94c;--cream:#fff8df;--line:#dce3ec;--text:#19202a;--muted:#6a7480;--bg:#f4f6f9}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--text);background:#fff}
.app{height:100%;display:grid;grid-template-rows:64px 1fr}
.topbar{background:var(--navy);display:flex;align-items:center;gap:18px;padding:0 18px;color:#fff;box-shadow:0 1px 10px #0003;z-index:1002}
.brand{font-weight:800;font-size:23px;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--gold)}
.top-summary{font-size:13px;color:#d9e4f2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:8px}
.top-btn{border:1px solid #ffffff35;background:#ffffff10;color:#fff;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}
.top-btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.main{min-height:0;display:grid;grid-template-columns:350px 1fr}
.sidebar{min-height:0;overflow:auto;border-right:1px solid var(--line);background:#fff}
.side-head{position:sticky;top:0;background:#fff;z-index:4;padding:16px 17px 11px;border-bottom:1px solid var(--line)}
.side-head h2{margin:0 0 4px;font-size:17px}
.count{font-size:13px;color:var(--muted)}
.filters{padding:12px 16px 18px}
.group{border-bottom:1px solid #edf0f4;padding:0 0 13px;margin:0 0 13px}
.label{font-size:12px;font-weight:800;color:#344154;margin-bottom:6px;text-transform:uppercase;letter-spacing:.35px}
.field,select,input[type=date],input[type=number],input[type=text]{width:100%;border:1px solid #cfd7e2;border-radius:7px;padding:9px 10px;background:#fff;font-size:14px;outline:none}
.field:focus,select:focus,input:focus{border-color:#7aa5d6;box-shadow:0 0 0 3px #1d66b21a}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:11px;color:#7d8794;line-height:1.35;margin-top:5px}
.apply-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}.btn.secondary{background:#eef2f7;color:#344154}
.results-title{display:flex;justify-content:space-between;align-items:center;margin:15px 0 8px}
.results-title b{font-size:14px}.results-title span{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:8px}
.card{border:1px solid #dde4ec;border-radius:9px;padding:10px;background:#fff;cursor:pointer;transition:.15s}
.card:hover{border-color:#98afd0;box-shadow:0 3px 12px #0a254012;transform:translateY(-1px)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-price{font-weight:900;font-size:16px;color:#b3261e}.firm-pill{font-size:11px;color:#fff;padding:4px 7px;border-radius:999px;font-weight:800}
.card-name{font-weight:800;font-size:13px;margin-top:6px}.card-meta{font-size:12px;color:#687382;margin-top:4px}
.map-wrap{position:relative;min-width:0;min-height:0;background:#e8edf3}
#map{position:absolute;inset:0}
.map-search{position:absolute;z-index:900;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;width:min(650px,70%);pointer-events:none}
.map-search input,.map-search button{pointer-events:auto}
.map-search input{height:43px;background:#fff;box-shadow:0 2px 10px #0002}
.search-area-btn{height:43px;background:#fff;color:var(--navy);border:1px solid #ccd5df;border-radius:8px;padding:0 13px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:0 2px 10px #0002}
.search-area-btn.dirty{background:var(--gold);border-color:#e1b936}
.map-tools{position:absolute;z-index:900;right:12px;top:72px;display:grid;gap:7px}
.map-tool{background:#fff;border:1px solid #d2dae4;border-radius:8px;padding:9px 10px;font-size:12px;font-weight:800;box-shadow:0 2px 8px #0002;cursor:pointer;color:#24344a}
.legend{position:absolute;z-index:890;left:12px;bottom:16px;background:#fffffff2;border:1px solid #d9e0e8;border-radius:10px;padding:10px 11px;box-shadow:0 2px 12px #0002;max-width:270px}
.legend-title{font-weight:900;font-size:12px;margin-bottom:5px}.legend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px}
.legend-item{font-size:11px;display:flex;align-items:center;gap:5px;white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.active-chip{position:absolute;z-index:890;top:66px;left:14px;background:#fff7d7;border:1px solid #e4c65d;color:#644f00;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;display:none}
.property-pin{width:22px;height:22px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 5px #0007}
.property-pin-inner{width:7px;height:7px;background:#fff;border-radius:50%;position:absolute;left:5.5px;top:5.5px}
.leaflet-tooltip.pv-tip{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:7px 9px;box-shadow:0 2px 9px #0005}
.leaflet-tooltip.pv-tip:before{display:none}
.tip-price{font-weight:900;color:var(--gold);font-size:14px}.tip-firm{font-weight:800}.tip-sub{font-size:11px;color:#dce5ef;margin-top:2px}
.popup{min-width:270px;max-width:330px}.popup-price{font-size:21px;color:#b3261e;font-weight:900}.popup-firm{font-size:11px;font-weight:900;color:#fff;border-radius:99px;padding:4px 7px;display:inline-block;margin-left:5px;vertical-align:3px}
.popup-title{font-size:15px;font-weight:900;margin:6px 0 3px}.popup-sub{font-size:12px;color:#66717e;margin-bottom:9px}
.popup-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:12px;border-top:1px solid #e8edf2;padding-top:8px}.popup-grid b{color:#25354b}
.popup-address{font-size:11px;color:#697381;margin-top:9px;padding-top:8px;border-top:1px solid #e8edf2}
.popup-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.popup-actions a{background:#eef3f8;color:#103d70;padding:6px 8px;border-radius:6px;text-decoration:none;font-weight:800;font-size:11px}.popup-actions a.primary{background:var(--navy);color:#fff}
.poi-icon{width:25px;height:25px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 1px 5px #0006;color:var(--navy);font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}
.marker-cluster div{background:var(--navy)!important;color:var(--gold)!important;font-weight:900}.marker-cluster{background:#f2c94c66!important}
.empty{padding:20px 8px;color:#77818d;text-align:center;font-size:13px}
@media(max-width:900px){.main{grid-template-columns:300px 1fr}.top-summary{display:none}.legend{display:none}.map-search{width:60%}}
@media(max-width:700px){.app{grid-template-rows:58px 1fr}.main{grid-template-columns:1fr}.sidebar{position:absolute;z-index:1001;top:58px;bottom:0;left:0;width:310px;transform:translateX(-100%);transition:.2s;box-shadow:5px 0 20px #0003}.sidebar.open{transform:translateX(0)}.map-wrap{height:100%}.map-search{left:12px;transform:none;width:calc(100% - 24px)}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Prime<span>Visa</span> Emlak Haritası</div>
    <div class="top-summary" id="topSummary"></div>
    <div class="top-actions">
      <button class="top-btn" id="athensBtn">Atina</button>
      <button class="top-btn" id="greeceBtn">Yunanistan Geneli</button>
      <button class="top-btn gold" id="fitBtn">Sonuçları Göster</button>
    </div>
  </div>
  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <h2>Harita Üzerinden Emlak Ara</h2>
        <div class="count" id="sideCount"></div>
      </div>
      <div class="filters">
        <div class="group">
          <div class="label">Bölge / Proje / Adres</div>
          <input id="area" class="field" type="text" placeholder="Örn. Kallithea, Piraeus, Kythnos"/>
        </div>
        <div class="group">
          <div class="label">Fiyat (€)</div>
          <div class="twocol">
            <input id="minPrice" type="number" placeholder="Min €" min="0" step="1000"/>
            <input id="maxPrice" type="number" placeholder="Max €" min="0" step="1000"/>
          </div>
        </div>
        <div class="group">
          <div class="label">Durum</div>
          <select id="status"></select>
        </div>
        <div class="group">
          <div class="label">Firma</div>
          <select id="firm"></select>
        </div>
        <div class="group">
          <div class="label">Toplam m²</div>
          <div class="twocol">
            <input id="minM2" type="number" placeholder="Min m²" min="0"/>
            <input id="maxM2" type="number" placeholder="Max m²" min="0"/>
          </div>
        </div>
        <div class="group">
          <div class="label">Yatak Odası</div>
          <select id="bedrooms">
            <option value="">Hepsi</option>
            <option value="0">Stüdyo</option><option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option><option value="5+">5+</option>
          </select>
        </div>
        <div class="group">
          <div class="label">Golden Visa Uygunluğu</div>
          <select id="gv">
            <option value="">Hepsi</option><option value="Yes">Evet</option><option value="No">Hayır</option><option value="Unknown">Teyitsiz</option>
          </select>
        </div>
        <div class="group">
          <div class="label">En Geç Teslim</div>
          <input id="delivery" type="date"/>
          <div class="note">Yalnızca doğrulanmış gerçek tarih bulunan kayıtlar bu filtreye girer.</div>
        </div>
        </div>
        </div>
        <div class="apply-row">
          <button class="btn primary" id="applyBtn">Filtrele</button>
          <button class="btn secondary" id="resetBtn">Temizle</button>
        </div>
        <div class="results-title"><b>Sonuçlar</b><span id="visibleCount"></span></div>
        <div class="cards" id="cards"></div>
      </div>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-search">
        <input id="mapSearch" type="text" placeholder="İlçe, mahalle, ada, proje veya adres ara"/>
        <button class="search-area-btn" id="mapAreaBtn">Bu bölgede ara</button>
      </div>
      <div class="active-chip" id="activeChip">Harita sınırı aktif · <u id="clearBounds">kaldır</u></div>
      <div class="map-tools">
        <button class="map-tool" id="poiBtn">★ Önemli Noktalar</button>
        <button class="map-tool" id="listBtn">☰ Filtreler</button>
        <button class="map-tool" id="fullscreenBtn">⛶ Tam Ekran</button>
      </div>
      <div class="legend" id="legend"></div>
    </section>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
let DATA, records, colors;

(async function boot(){
  const loading = document.createElement("div");
  loading.id = "pvLoading";
  loading.style.cssText = "position:fixed;inset:64px 0 0 0;background:#fff;z-index:5000;display:flex;align-items:center;justify-content:center;font:700 16px Arial;color:#071d3a";
  loading.textContent = "PrimeVisa verileri yükleniyor…";
  document.body.appendChild(loading);
  try {
    const res = await fetch("./data.json?v=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error("data.json HTTP " + res.status);
    DATA = await res.json();
    records = DATA.records || [];
    colors = DATA.firmColors || {};


const euro = n => (n==null ? "—" : new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n));
const num = n => n==null ? "—" : new Intl.NumberFormat("en-US",{maximumFractionDigits:1}).format(n);
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const link = (u,label,cls="") => u ? `<a class="${cls}" target="_blank" rel="noopener" href="${esc(u)}">${label}</a>` : "";
const colorFor = firm => colors[firm] || "#546E7A";
const trStatus = s => ({
  "Available":"Müsait","Reserved":"Rezerve","Booked":"Rezerveli","On Hold":"Beklemede",
  "Under Offer":"Teklif Altında","Locked":"Kilitli","Sold":"Satıldı","Check":"Kontrol Gerekli",
  "Check Availability":"Müsaitlik Kontrolü Gerekli"
}[s] || s || "—");
const trGV = s => s==="Yes" ? "Evet" : s==="No" ? "Hayır" : "Teyitsiz";
const trSimple = s => { const v=String(s||"").trim(); if(!v) return "—"; if(/^yes$/i.test(v)) return "Evet"; if(/^no$/i.test(v)) return "Hayır"; return v; };

const map = L.map("map",{zoomControl:true,minZoom:5,maxZoom:19,preferCanvas:true}).setView([37.9838,23.7275],11);
// API anahtarı gerektirmeyen harita katmanları
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const hot = L.tileLayer("https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors, Tiles style by HOT'
});

L.control.layers({"Standart Harita":osm,"Alternatif Harita":hot},null,{position:"bottomright"}).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover:false,spiderfyOnMaxZoom:true,disableClusteringAtZoom:16,maxClusterRadius:45
}).addTo(map);

let markerById = new Map(), shown = [], activeBounds = null, poiVisible = true, suppressMove=false;

const poiLayer = L.layerGroup().addTo(map);
DATA.pois.forEach(p=>{
  const icon=L.divIcon({className:"",html:`<div class="poi-icon">★</div>`,iconSize:[25,25],iconAnchor:[12,12]});
  L.marker([p.lat,p.lng],{icon,zIndexOffset:-1000}).bindTooltip(esc(p.name),{direction:"top"}).addTo(poiLayer);
});

function pinIcon(firm){
  const c=colorFor(firm);
  return L.divIcon({className:"",html:`<div class="property-pin" style="background:${c}"><div class="property-pin-inner"></div></div>`,iconSize:[22,22],iconAnchor:[11,22],popupAnchor:[0,-19]});
}
function popupHtml(r){
  const firmColor=colorFor(r.firm);
  return `<div class="popup">
    <div><span class="popup-price">${euro(r.price)}</span><span class="popup-firm" style="background:${firmColor}">${esc(r.firm)}</span></div>
    <div class="popup-title">${esc(r.project)} · ${esc(r.unit)}</div>
    <div class="popup-sub">${esc(r.area)}${r.floor?` · Kat ${esc(r.floor)}`:""}</div>
    <div class="popup-grid">
      <div><b>Toplam:</b> ${num(r.total)} m²</div>
      <div><b>Oda:</b> ${r.bedrooms==null?"—":esc(r.bedrooms)}</div>
      <div><b>Durum:</b> ${esc(trStatus(r.status))}</div>
      <div><b>Golden Visa:</b> ${esc(trGV(r.gv))}</div>
      <div><b>Teslim:</b> ${esc(r.delivery||"—")}</div>
      <div><b>Otopark:</b> ${esc(trSimple(r.parking))}</div>
      <div><b>Kira:</b> ${esc(r.rental||"—")}</div>
      <div><b>Atina Merkez:</b> ${num(r.athensKm)} km</div>
      <div><b>Deniz (~):</b> ${num(r.seaKmApprox)} km</div>
      <div><b>Güncellik:</b> ${esc(r.freshness||"—")}</div>
    </div>
    <div class="popup-address">${esc(r.address)}</div>
    <div class="popup-actions">
      ${link(r.mapUrl||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.address)}`,"Google Maps","primary")}
      ${link(r.media,"Broşür / Media")}
      ${link(r.source,"Kaynak")}
    </div>
  </div>`;
}
function tooltipHtml(r){
  return `<div><span class="tip-price">${euro(r.price)}</span> · <span class="tip-firm">${esc(r.firm)}</span></div>
          <div class="tip-sub">${esc(r.project)} · Daire ${esc(r.unit)} · ${num(r.total)} m²</div>`;
}

function statusOptions(){
  const statuses=[...new Set(records.map(r=>r.status).filter(Boolean))].sort();
  document.getElementById("status").innerHTML=`<option value="">Hepsi</option>`+statuses.map(x=>`<option value="${esc(x)}">${esc(trStatus(x))}</option>`).join("");
  document.getElementById("status").value="Available";
  const firms=[...new Set(records.map(r=>r.firm).filter(Boolean))].sort();
  document.getElementById("firm").innerHTML=`<option value="">Tüm Firmalar</option>`+firms.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
}
statusOptions();

function filters(){
  const val=id=>document.getElementById(id).value.trim();
  return {
    q: val("area").toLowerCase(),
    minPrice:+val("minPrice")||null,maxPrice:+val("maxPrice")||null,
    status:val("status"),firm:val("firm"),
    minM2:+val("minM2")||null,maxM2:+val("maxM2")||null,
    bedrooms:val("bedrooms"),gv:val("gv"),delivery:val("delivery")
  };
}
function pass(r,f){
  const hay=`${r.area} ${r.project} ${r.address} ${r.unit} ${r.firm}`.toLowerCase();
  if(f.q && !hay.includes(f.q)) return false;
  if(f.minPrice!=null && (r.price==null || r.price<f.minPrice)) return false;
  if(f.maxPrice!=null && (r.price==null || r.price>f.maxPrice)) return false;
  if(f.status && r.status!==f.status) return false;
  if(f.firm && r.firm!==f.firm) return false;
  if(f.minM2!=null && (r.total==null || r.total<f.minM2)) return false;
  if(f.maxM2!=null && (r.total==null || r.total>f.maxM2)) return false;
  if(f.bedrooms==="5+" && !(r.bedrooms>=5)) return false;
  if(f.bedrooms && f.bedrooms!=="5+" && Number(r.bedrooms)!==Number(f.bedrooms)) return false;
  if(f.gv==="Unknown" && r.gv) return false;
  if(f.gv==="Yes" && r.gv!=="Yes") return false;
  if(f.gv==="No" && r.gv!=="No") return false;
  if(f.delivery && (!r.deliveryDate || r.deliveryDate>f.delivery)) return false;
  if(activeBounds && !activeBounds.contains([r.lat,r.lng])) return false;
  return true;
}
function renderCards(arr){
  const cards=document.getElementById("cards");
  const cap=120;
  if(!arr.length){cards.innerHTML=`<div class="empty">Bu kriterlerde sonuç bulunamadı.</div>`;return}
  cards.innerHTML=arr.slice(0,cap).map(r=>`<div class="card" data-id="${esc(r.id)}">
    <div class="card-top"><div class="card-price">${euro(r.price)}</div><span class="firm-pill" style="background:${colorFor(r.firm)}">${esc(r.firm)}</span></div>
    <div class="card-name">${esc(r.project)} · ${esc(r.unit)}</div>
    <div class="card-meta">${esc(r.area)} · ${num(r.total)} m²${r.bedrooms!=null?` · ${r.bedrooms} oda`:""} · ${esc(trStatus(r.status))}</div>
  </div>`).join("")+(arr.length>cap?`<div class="empty">İlk ${cap} sonuç gösteriliyor. Harita tüm sonuçları içerir.</div>`:"");
  cards.querySelectorAll(".card").forEach(el=>el.onclick=()=>{
    const m=markerById.get(el.dataset.id); if(m){map.setView(m.getLatLng(),16);m.openPopup()}
  });
}
function update(){
  const f=filters();
  shown=records.filter(r=>pass(r,f));
  cluster.clearLayers(); markerById.clear();
  shown.forEach(r=>{
    const m=L.marker([r.lat,r.lng],{icon:pinIcon(r.firm),title:`${euro(r.price)} · ${r.firm}`})
      .bindTooltip(tooltipHtml(r),{className:"pv-tip",direction:"top",offset:[0,-18],sticky:true,opacity:.98})
      .bindPopup(popupHtml(r),{maxWidth:360});
    cluster.addLayer(m); markerById.set(r.id,m);
  });
  renderCards(shown);
  document.getElementById("sideCount").textContent=`${shown.length.toLocaleString("tr-TR")} ev · ${new Set(shown.map(r=>r.project)).size} proje`;
  document.getElementById("visibleCount").textContent=`${shown.length} sonuç`;
  document.getElementById("topSummary").textContent=`${records.length.toLocaleString("tr-TR")} toplam unit · ${new Set(records.map(r=>r.project)).size} proje · ${new Set(records.map(r=>r.firm)).size} firma · Veri: ${DATA.generatedAt}`;
}
function fitResults(){
  if(!shown.length)return;
  const b=L.latLngBounds(shown.map(r=>[r.lat,r.lng]));
  suppressMove=true;map.fitBounds(b.pad(.08),{maxZoom:14});
  setTimeout(()=>suppressMove=false,350);
}
function reset(){
  ["area","minPrice","maxPrice","minM2","maxM2","delivery"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("status").value="Available";document.getElementById("firm").value="";
  document.getElementById("bedrooms").value="";document.getElementById("gv").value="";
  document.getElementById("mapSearch").value="";activeBounds=null;document.getElementById("activeChip").style.display="none";
  update();suppressMove=true;map.setView([37.9838,23.7275],11);setTimeout(()=>suppressMove=false,300);
}

document.getElementById("applyBtn").onclick=()=>{update();fitResults()};
document.getElementById("resetBtn").onclick=reset;
document.getElementById("fitBtn").onclick=fitResults;
document.getElementById("athensBtn").onclick=()=>{activeBounds=null;document.getElementById("activeChip").style.display="none";update();suppressMove=true;map.setView([37.9838,23.7275],11);setTimeout(()=>suppressMove=false,300)};
