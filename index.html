<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrimeVisa Yunanistan Emlak Haritası</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--navy:#071d3a;--gold:#f2c94c;--line:#dce3ec;--muted:#6b7582;--bg:#f5f7fa}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:#18202a;background:#fff}
#app{height:100%;display:grid;grid-template-rows:64px minmax(0,1fr)}
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px;gap:18px;box-shadow:0 2px 10px #0002;z-index:1200}
.brand{font-size:23px;font-weight:900;white-space:nowrap}.brand span{color:var(--gold)}
.summary{font-size:13px;color:#dbe5f1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;gap:8px}
.top-actions button{border:1px solid #ffffff35;background:#ffffff0f;color:#fff;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.top-actions .gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.workspace{min-height:0;display:grid;grid-template-columns:350px minmax(0,1fr)}
.sidebar{min-height:0;overflow:auto;border-right:1px solid var(--line);background:#fff}
.side-head{position:sticky;top:0;z-index:5;background:#fff;padding:16px 17px 11px;border-bottom:1px solid var(--line)}
.side-head h2{font-size:17px;margin:0 0 4px}.count{font-size:13px;color:var(--muted)}
.filters{padding:12px 16px 20px}.group{padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid #edf0f4}.label{font-size:12px;font-weight:900;color:#344154;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
input,select{width:100%;border:1px solid #ccd5e0;border-radius:7px;background:#fff;padding:9px 10px;font-size:14px;outline:none}input:focus,select:focus{border-color:#719cca;box-shadow:0 0 0 3px #1d66b217}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{font-size:11px;color:#788391;line-height:1.35;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#edf2f7;color:#344154}
.results-title{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}.results-title b{font-size:14px}.results-title span{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:8px}.card{border:1px solid #dce4ed;border-radius:9px;padding:10px;background:#fff;cursor:pointer;transition:.15s}.card:hover{border-color:#9cb3ce;box-shadow:0 3px 12px #0a254012;transform:translateY(-1px)}.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.price{font-size:16px;font-weight:900;color:#b3261e}.pill{font-size:11px;color:#fff;padding:4px 7px;border-radius:99px;font-weight:900}.card-name{font-size:13px;font-weight:900;margin-top:6px}.meta{font-size:12px;color:#687382;margin-top:4px}.empty{padding:18px 6px;text-align:center;color:#7b8591;font-size:13px}
.map-wrap{position:relative;min-width:0;min-height:0;background:#e6ebf1}#map{position:absolute;inset:0;z-index:1}
.map-search{position:absolute;z-index:900;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;width:min(680px,72%);pointer-events:none}.map-search input,.map-search button{pointer-events:auto}.map-search input{height:44px;background:#fff;box-shadow:0 2px 10px #0002}.search-area{height:44px;border:1px solid #d7b536;background:#fff;color:var(--navy);border-radius:8px;padding:0 13px;font-weight:900;white-space:nowrap;cursor:pointer;box-shadow:0 2px 10px #0002}.search-area.dirty{background:var(--gold)}
.map-tools{position:absolute;z-index:900;top:72px;right:12px;display:grid;gap:7px}.map-tools button{background:#fff;border:1px solid #d2dae4;border-radius:8px;padding:9px 10px;font-size:12px;font-weight:900;color:#24344a;cursor:pointer;box-shadow:0 2px 8px #0002}.chip{position:absolute;z-index:890;top:67px;left:14px;background:#fff7d7;border:1px solid #e4c65d;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#604c00;display:none}.chip u{cursor:pointer}
.legend{position:absolute;z-index:890;left:12px;bottom:16px;background:#fffffff2;border:1px solid #d9e0e8;border-radius:10px;padding:10px 11px;box-shadow:0 2px 12px #0002;max-width:280px}.legend-title{font-size:12px;font-weight:900;margin-bottom:5px}.legend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px}.legend-item{font-size:11px;display:flex;align-items:center;gap:5px;white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.property-pin{width:22px;height:22px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 5px #0007}.property-pin i{width:7px;height:7px;background:#fff;border-radius:50%;position:absolute;left:5.5px;top:5.5px}.poi{width:25px;height:25px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 1px 5px #0006;color:var(--navy);font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}
.leaflet-tooltip.pv-tip{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:7px 9px;box-shadow:0 2px 9px #0005}.leaflet-tooltip.pv-tip:before{display:none}.tip-price{font-weight:900;color:var(--gold);font-size:14px}.tip-firm{font-weight:900}.tip-sub{font-size:11px;color:#dce5ef;margin-top:2px}.marker-cluster div{background:var(--navy)!important;color:var(--gold)!important;font-weight:900}.marker-cluster{background:#f2c94c66!important}
.popup{min-width:265px;max-width:330px}.popup-price{font-size:21px;color:#b3261e;font-weight:900}.popup-firm{font-size:11px;font-weight:900;color:#fff;border-radius:99px;padding:4px 7px;display:inline-block;margin-left:5px;vertical-align:3px}.popup-title{font-size:15px;font-weight:900;margin:6px 0 3px}.popup-sub{font-size:12px;color:#66717e;margin-bottom:9px}.popup-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:12px;border-top:1px solid #e8edf2;padding-top:8px}.popup-address{font-size:11px;color:#697381;margin-top:9px;padding-top:8px;border-top:1px solid #e8edf2}.popup-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.popup-actions a{background:#eef3f8;color:#103d70;padding:6px 8px;border-radius:6px;text-decoration:none;font-weight:900;font-size:11px}.popup-actions .mainlink{background:var(--navy);color:#fff}
.loading{position:fixed;inset:64px 0 0;background:#fff;z-index:5000;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy)}
@media(max-width:900px){.workspace{grid-template-columns:300px minmax(0,1fr)}.summary{display:none}.legend{display:none}.map-search{width:62%}}
@media(max-width:700px){#app{grid-template-rows:58px 1fr}.brand{font-size:18px}.top-actions button:not(.gold){display:none}.workspace{grid-template-columns:1fr}.sidebar{position:absolute;z-index:1100;top:58px;bottom:0;left:0;width:310px;transform:translateX(-100%);transition:.2s;box-shadow:5px 0 20px #0003}.sidebar.open{transform:translateX(0)}.map-search{left:12px;right:12px;transform:none;width:auto}.map-search input{min-width:0}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Prime<span>Visa</span> Emlak Haritası</div>
    <div class="summary" id="summary"></div>
    <div class="top-actions">
      <button id="athensBtn">Atina</button>
      <button id="greeceBtn">Yunanistan Geneli</button>
      <button class="gold" id="fitBtn">Sonuçları Göster</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <h2>Harita Üzerinden Emlak Ara</h2>
        <div class="count" id="sideCount"></div>
      </div>
      <div class="filters">
        <div class="group"><div class="label">Bölge / Proje / Adres</div><input id="area" type="text" placeholder="Örn. Kallithea, Piraeus, Kythnos"></div>
        <div class="group"><div class="label">Fiyat (€)</div><div class="twocol"><input id="minPrice" type="number" placeholder="Min €" min="0" step="1000"><input id="maxPrice" type="number" placeholder="Max €" min="0" step="1000"></div></div>
        <div class="group"><div class="label">Durum</div><select id="status"></select></div>
        <div class="group"><div class="label">Firma</div><select id="firm"></select></div>
        <div class="group"><div class="label">Toplam m²</div><div class="twocol"><input id="minM2" type="number" placeholder="Min m²" min="0"><input id="maxM2" type="number" placeholder="Max m²" min="0"></div></div>
        <div class="group"><div class="label">Yatak Odası</div><select id="bedrooms"><option value="">Hepsi</option><option value="0">Stüdyo</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5+">5+</option></select></div>
        <div class="group"><div class="label">Golden Visa Uygunluğu</div><select id="gv"><option value="">Hepsi</option><option value="Yes">Evet</option><option value="No">Hayır</option><option value="Unknown">Teyitsiz</option></select></div>
        <div class="group"><div class="label">En Geç Teslim</div><input id="delivery" type="date"><div class="note">Yalnızca doğrulanmış gerçek tarih bulunan kayıtlar bu filtreye girer.</div></div>
        <div class="actions"><button class="btn primary" id="applyBtn">Filtrele</button><button class="btn secondary" id="resetBtn">Temizle</button></div>
        <div class="results-title"><b>Sonuçlar</b><span id="visibleCount"></span></div>
        <div class="cards" id="cards"></div>
      </div>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-search"><input id="mapSearch" type="text" placeholder="İlçe, mahalle, ada, proje veya adres ara"><button class="search-area" id="mapAreaBtn">Bu bölgede ara</button></div>
      <div class="chip" id="boundsChip">Harita sınırı aktif · <u id="clearBounds">kaldır</u></div>
      <div class="map-tools"><button id="poiBtn">★ Önemli Noktalar</button><button id="filtersBtn">☰ Filtreler</button><button id="fullBtn">⛶ Tam Ekran</button></div>
      <div class="legend" id="legend"></div>
    </section>
  </main>
</div>
<div class="loading" id="loading">PrimeVisa verileri yükleniyor…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(async()=>{
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const euro=n=>n==null?'—':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const num=n=>n==null?'—':new Intl.NumberFormat('tr-TR',{maximumFractionDigits:1}).format(n);
const trStatus=s=>({'Available':'Müsait','Reserved':'Rezerve','Booked':'Rezerveli','On Hold':'Beklemede','Under Offer':'Teklif Altında','Locked':'Kilitli','Sold':'Satıldı','Check':'Kontrol Gerekli','Check Availability':'Müsaitlik Kontrolü Gerekli'}[s]||s||'—');
const trGV=s=>s==='Yes'?'Evet':s==='No'?'Hayır':'Teyitsiz';
const link=(u,l,c='')=>u?`<a class="${c}" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`:'';
try{
  const res=await fetch('./data.json?v='+Date.now(),{cache:'no-store'}); if(!res.ok) throw new Error('data.json HTTP '+res.status);
  const DATA=await res.json(), records=DATA.records||[], colors=DATA.firmColors||{}; const colorFor=f=>colors[f]||'#546E7A';
  $('loading').remove();

  const map=L.map('map',{zoomControl:true,minZoom:5,maxZoom:19,preferCanvas:true}).setView([37.9838,23.7275],11);
  const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  const hot=L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
  L.control.layers({'Standart Harita':osm,'Alternatif Harita':hot},null,{position:'bottomright'}).addTo(map);
  const cluster=L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,disableClusteringAtZoom:16,maxClusterRadius:45}).addTo(map);
  const poiLayer=L.layerGroup().addTo(map);
  (DATA.pois||[]).forEach(p=>L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="poi">★</div>',iconSize:[25,25],iconAnchor:[12,12]}),zIndexOffset:-1000}).bindTooltip(esc(p.name),{direction:'top'}).addTo(poiLayer));
  let poiVisible=true, activeBounds=null, shown=[], markerById=new Map(), suppress=false;

  const statuses=[...new Set(records.map(r=>r.status).filter(Boolean))].sort();
  $('status').innerHTML='<option value="">Hepsi</option>'+statuses.map(x=>`<option value="${esc(x)}">${esc(trStatus(x))}</option>`).join(''); $('status').value='Available';
  const firms=[...new Set(records.map(r=>r.firm).filter(Boolean))].sort(); $('firm').innerHTML='<option value="">Tüm Firmalar</option>'+firms.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');

  function pinIcon(f){const c=colorFor(f);return L.divIcon({className:'',html:`<div class="property-pin" style="background:${c}"><i></i></div>`,iconSize:[22,22],iconAnchor:[11,22],popupAnchor:[0,-19]})}
  function popup(r){return `<div class="popup"><div><span class="popup-price">${euro(r.price)}</span><span class="popup-firm" style="background:${colorFor(r.firm)}">${esc(r.firm)}</span></div><div class="popup-title">${esc(r.project)} · ${esc(r.unit)}</div><div class="popup-sub">${esc(r.area)}${r.floor?` · Kat ${esc(r.floor)}`:''}</div><div class="popup-grid"><div><b>Toplam:</b> ${num(r.total)} m²</div><div><b>Oda:</b> ${r.bedrooms==null?'—':esc(r.bedrooms)}</div><div><b>Durum:</b> ${esc(trStatus(r.status))}</div><div><b>Golden Visa:</b> ${esc(trGV(r.gv))}</div><div><b>Teslim:</b> ${esc(r.delivery||'—')}</div><div><b>Otopark:</b> ${esc(r.parking||'—')}</div><div><b>Kira:</b> ${esc(r.rental||'—')}</div><div><b>Güncellik:</b> ${esc(r.freshness||'—')}</div></div><div class="popup-address">${esc(r.address)}</div><div class="popup-actions">${link(r.mapUrl||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.address)}`,'Google Maps','mainlink')}${link(r.media,'Broşür / Medya')}${link(r.source,'Kaynak')}</div></div>`}
  function tip(r){return `<div><span class="tip-price">${euro(r.price)}</span> · <span class="tip-firm">${esc(r.firm)}</span></div><div class="tip-sub">${esc(r.project)} · Daire ${esc(r.unit)} · ${num(r.total)} m²</div>`}
  function vals(){const v=id=>$(id).value.trim();return{q:v('area').toLowerCase(),minP:+v('minPrice')||null,maxP:+v('maxPrice')||null,status:v('status'),firm:v('firm'),minM:+v('minM2')||null,maxM:+v('maxM2')||null,br:v('bedrooms'),gv:v('gv'),delivery:v('delivery')}}
  function pass(r,f){const hay=`${r.area} ${r.project} ${r.address} ${r.unit} ${r.firm}`.toLowerCase(); if(f.q&&!hay.includes(f.q))return false;if(f.minP!=null&&(r.price==null||r.price<f.minP))return false;if(f.maxP!=null&&(r.price==null||r.price>f.maxP))return false;if(f.status&&r.status!==f.status)return false;if(f.firm&&r.firm!==f.firm)return false;if(f.minM!=null&&(r.total==null||r.total<f.minM))return false;if(f.maxM!=null&&(r.total==null||r.total>f.maxM))return false;if(f.br==='5+'&&!(r.bedrooms>=5))return false;if(f.br&&f.br!=='5+'&&Number(r.bedrooms)!==Number(f.br))return false;if(f.gv==='Unknown'&&r.gv)return false;if(f.gv==='Yes'&&r.gv!=='Yes')return false;if(f.gv==='No'&&r.gv!=='No')return false;if(f.delivery&&(!r.deliveryDate||r.deliveryDate>f.delivery))return false;if(activeBounds&&!activeBounds.contains([r.lat,r.lng]))return false;return true}
  function renderCards(a){if(!a.length){$('cards').innerHTML='<div class="empty">Bu kriterlerde sonuç bulunamadı.</div>';return} const cap=100;$('cards').innerHTML=a.slice(0,cap).map(r=>`<div class="card" data-id="${esc(r.id)}"><div class="card-top"><div class="price">${euro(r.price)}</div><span class="pill" style="background:${colorFor(r.firm)}">${esc(r.firm)}</span></div><div class="card-name">${esc(r.project)} · ${esc(r.unit)}</div><div class="meta">${esc(r.area)} · ${num(r.total)} m²${r.bedrooms!=null?` · ${r.bedrooms} oda`:''} · ${esc(trStatus(r.status))}</div></div>`).join('')+(a.length>cap?`<div class="empty">İlk ${cap} sonuç listeleniyor. Haritada tüm sonuçlar var.</div>`:'');document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{const m=markerById.get(el.dataset.id);if(m){map.setView(m.getLatLng(),16);m.openPopup()}})}
  function update(){shown=records.filter(r=>pass(r,vals()));cluster.clearLayers();markerById.clear();shown.forEach(r=>{const m=L.marker([r.lat,r.lng],{icon:pinIcon(r.firm)}).bindTooltip(tip(r),{className:'pv-tip',direction:'top',offset:[0,-18],sticky:true,opacity:.98}).bindPopup(popup(r),{maxWidth:360});cluster.addLayer(m);markerById.set(r.id,m)});renderCards(shown);$('sideCount').textContent=`${shown.length.toLocaleString('tr-TR')} ev · ${new Set(shown.map(r=>r.project)).size} proje`;$('visibleCount').textContent=`${shown.length} sonuç`;$('summary').textContent=`${records.length.toLocaleString('tr-TR')} toplam daire · ${new Set(records.map(r=>r.project)).size} proje · ${new Set(records.map(r=>r.firm)).size} firma · Son veri: ${DATA.generatedAt}`}
  function fit(){if(!shown.length)return;const b=L.latLngBounds(shown.map(r=>[r.lat,r.lng]));suppress=true;map.fitBounds(b.pad(.08),{maxZoom:14});setTimeout(()=>suppress=false,350)}
  function reset(){['area','minPrice','maxPrice','minM2','maxM2','delivery'].forEach(id=>$(id).value='');$('status').value='Available';$('firm').value='';$('bedrooms').value='';$('gv').value='';$('mapSearch').value='';activeBounds=null;$('boundsChip').style.display='none';update();suppress=true;map.setView([37.9838,23.7275],11);setTimeout(()=>suppress=false,300)}

  $('applyBtn').onclick=()=>{update();fit()};$('resetBtn').onclick=reset;$('fitBtn').onclick=fit;
  $('athensBtn').onclick=()=>{activeBounds=null;$('boundsChip').style.display='none';update();suppress=true;map.setView([37.9838,23.7275],11);setTimeout(()=>suppress=false,300)};
  $('greeceBtn').onclick=()=>{activeBounds=null;$('boundsChip').style.display='none';update();suppress=true;map.fitBounds([[34.5,19.2],[41.9,29.8]]);setTimeout(()=>suppress=false,350)};
  $('mapAreaBtn').onclick=()=>{activeBounds=map.getBounds();$('boundsChip').style.display='block';$('mapAreaBtn').classList.remove('dirty');update()};$('clearBounds').onclick=()=>{activeBounds=null;$('boundsChip').style.display='none';update()};
  $('poiBtn').onclick=()=>{poiVisible=!poiVisible;if(poiVisible)poiLayer.addTo(map);else map.removeLayer(poiLayer)};$('fullBtn').onclick=()=>{const el=document.querySelector('.map-wrap');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};$('filtersBtn').onclick=()=>$('sidebar').classList.toggle('open');
  $('mapSearch').addEventListener('input',e=>{$('area').value=e.target.value;update()});$('area').addEventListener('input',e=>$('mapSearch').value=e.target.value);document.querySelectorAll('.filters input,.filters select').forEach(el=>el.addEventListener('change',update));map.on('moveend',()=>{if(!suppress)$('mapAreaBtn').classList.add('dirty')});
  $('legend').innerHTML='<div class="legend-title">Firmalar</div><div class="legend-grid">'+Object.entries(colors).filter(([k])=>k!=='V² Development').map(([k,c])=>`<div class="legend-item"><i class="dot" style="background:${c}"></i>${esc(k)}</div>`).join('')+'</div><div class="note">★ altın: önemli referans noktaları</div>';
  update(); setTimeout(()=>map.invalidateSize(),100);
}catch(err){console.error(err);$('loading').innerHTML=`<div style="max-width:620px;padding:24px;text-align:center"><h2>Veri yüklenemedi</h2><p>data.json dosyası okunamadı.</p><small>${esc(err)}</small></div>`}
})();
</script>
</body>
</html>
